<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 30px; }
        .container { max-width: 560px; margin: auto; background: #ffffff; padding: 25px 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        h1 { text-align: center; color: #1f3a5f; margin-top: 0; }
        label.title { display: block; margin-top: 14px; font-weight: bold; color: #333333; }
        input[type="text"], input[type="number"], select, input[type="file"] { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #b5bfcc; border-radius: 4px; box-sizing: border-box; }
        .options { margin-top: 6px; }
        .options label { margin-right: 18px; }
        .buttons { margin-top: 22px; text-align: center; }
        input[type="submit"], input[type="reset"] { padding: 10px 28px; border: none; border-radius: 4px; color: #ffffff; font-size: 15px; cursor: pointer; }
        input[type="submit"] { background: #1f6feb; }
        input[type="reset"] { background: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <h1>Employee Registration Form</h1>

    <!-- POST method, process.php handles the data, multipart/form-data is required for file upload -->
    <form action="process.php" method="post" enctype="multipart/form-data">

        <!-- Employee Full Name (Text) -->
        <label class="title">Employee Full Name</label>
        <input type="text" name="fullName">

        <!-- Employee ID (Text) -->
        <label class="title">Employee ID</label>
        <input type="text" name="employeeId">

        <!-- Gender (Radio Button) -->
        <label class="title">Gender</label>
        <div class="options">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <!-- Department (Drop-down List) - first option has an empty value so "not selected" can be detected -->
        <label class="title">Department</label>
        <select name="department">
            <option value="">-- Select Department --</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance">Finance</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Administration">Administration</option>
        </select>

        <!-- Employment Type (Radio Button) -->
        <label class="title">Employment Type</label>
        <div class="options">
            <label><input type="radio" name="employmentType" value="Full-Time"> Full-Time</label>
            <label><input type="radio" name="employmentType" value="Part-Time"> Part-Time</label>
        </div>

        <!-- Number fields: step="any" lets the server (PHP) do the validation -->
        <label class="title">Basic Salary ($)</label>
        <input type="number" name="basicSalary" step="any">

        <label class="title">Allowance ($)</label>
        <input type="number" name="allowance" step="any">

        <label class="title">Deduction ($)</label>
        <input type="number" name="deduction" step="any">

        <label class="title">Years of Service</label>
        <input type="number" name="yearsOfService" step="any">

        <!-- Employee Document (File Upload) -->
        <label class="title">Employee Document</label>
        <input type="file" name="document">

        <div class="buttons">
            <input type="reset" value="Reset">
            <input type="submit" name="submit" value="Submit">
        </div>
    </form>
</div>
</body>
</html>
